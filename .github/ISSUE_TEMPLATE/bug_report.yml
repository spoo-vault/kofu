name: 🐛 Bug Report
description: Create a report to help us improve KOFU on Stellar
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the issue.
      placeholder: |
        1. Open Command Terminal
        2. Type 'Pay 100 USDC...'
        3. Click 'Fund Escrow'
        4. See error...
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - "Stellar Testnet"
        - "Local Dev / Demo Sandbox"
        - "Stellar Mainnet"
    validations:
      required: true
